name: Deploy to DigitalOcean

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check for required secrets
        run: |
          MISSING_SECRETS=()
          if [ -z "${{ secrets.DO_HOST }}" ]; then MISSING_SECRETS+=("DO_HOST"); fi
          if [ -z "${{ secrets.DO_USERNAME }}" ]; then MISSING_SECRETS+=("DO_USERNAME"); fi
          if [ -z "${{ secrets.DO_SSH_KEY }}" ]; then MISSING_SECRETS+=("DO_SSH_KEY"); fi
          if [ -z "${{ secrets.DEPLOY_DIR }}" ]; then MISSING_SECRETS+=("DEPLOY_DIR"); fi
          
          if [ ${#MISSING_SECRETS[@]} -ne 0 ]; then
            echo "Error: The following GitHub Secrets are missing: ${MISSING_SECRETS[*]}"
            echo "Please add them in Settings > Secrets and variables > Actions"
            exit 1
          fi

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USERNAME }}
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            cd ${{ secrets.DEPLOY_DIR }}
            # Pull latest code
            git pull origin main
            # Rebuild and restart containers
            # Note: NEXT_PUBLIC_API_URL is baked at build time, so --build is essential.
            docker compose up --build -d
            # Clean up dangling images to save space on the Droplet
            docker image prune -f
