name: Deploy to DigitalOcean

on:
  push:
    branches:
      - prod

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.HOST_NAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /resume_optimize/resume-tailoring
            # Pull latest code
            git pull origin prod
            # Rebuild and restart containers
            # Note: NEXT_PUBLIC_API_URL is baked at build time, so --build is essential.
            docker compose up --build -d
            # Clean up dangling images to save space on the Droplet
            # docker image prune -f
