services:
  db:
    image: postgres:15
    container_name: resume_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-resumedb}
    # No host port: internal-only (currently unused by the app).
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - resume_network

  qdrant:
    image: qdrant/qdrant:latest
    container_name: resume_qdrant
    restart: always
    # No host port: reachable only by backend over resume_network.
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - resume_network

  redis:
    image: redis:alpine
    container_name: resume_redis
    restart: always
    # No host port: reachable only by backend over resume_network.
    networks:
      - resume_network

  backend:
    build: ./backend
    container_name: resume_backend
    restart: always
    ports:
      - "127.0.0.1:8004:8000"
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-resumedb}
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - LLM_PROVIDER=${LLM_PROVIDER:-groq}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    depends_on:
      - db
      - qdrant
    volumes:
      - hf_cache:/root/.cache/huggingface
      - backend_uploads:/app/uploads
      - ./backend/data:/app/data
    networks:
      - resume_network

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://brollysolutions.in/brollyresume}
        NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH:-/brollyresume}
    container_name: resume_frontend
    restart: always
    ports:
      - "127.0.0.1:3004:3004"
    depends_on:
      - backend
    networks:
      - resume_network

networks:
  resume_network:
    driver: bridge

volumes:
  postgres_data:
  qdrant_data:
  hf_cache:
  backend_uploads:
